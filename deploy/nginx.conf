# Configuration nginx du portfolio (site statique exporté par Next.js).
# Destinée à l'image nginx-unprivileged (écoute sur 8080, pas de root).
# Les en-têtes de sécurité sont générés au build : deploy/generated/security-headers.conf.
# Piège nginx : un bloc `location` qui contient add_header perd ceux du bloc parent.
# C'est pourquoi le fichier d'en-têtes est inclus dans CHAQUE location.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Compression (le HTML et le JS compressés restent sous les limites de Cloudflare).
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Pages exportées : /contact/ -> /contact/index.html
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Ressources versionnées par Next.js (nom de fichier = hachage du contenu).
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # security.txt (RFC 9116) : texte brut, jamais mis en cache longtemps.
    location = /.well-known/security.txt {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Aucun fichier caché n'est servi, hormis /.well-known/.
    location ~ /\.(?!well-known) {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
